<!doctype html>
<html lang="en" data-theme="light" data-persona="del" data-empty="false" data-advanced="false" data-strict="strict">
<head>
<meta charset="utf-8" />
<title>Living Proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Special+Elite&display=swap" rel="stylesheet" />

<script>
  // Tweakable defaults — host rewrites this JSON on disk
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "dark",
    "persona": "del",
    "populated": true,
    "advanced": false,
    "strict": "permissive"
  }/*EDITMODE-END*/;
</script>

<style>
  /* ─────────────────────────────────────────────────────
     DESIGN TOKENS — editorial SaaS, three themes
     ───────────────────────────────────────────────────── */
  :root {
    --ff-display: "Instrument Serif", "Times New Roman", serif;
    --ff-body:    "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --ff-mono:    "JetBrains Mono", ui-monospace, Menlo, monospace;
    --ff-type:    "Special Elite", "JetBrains Mono", ui-monospace, Menlo, monospace;

    /* light (default) */
    --bg:         #f6f3ec;
    --bg-2:       #efeadd;
    --surface:    #ffffff;
    --surface-2:  #faf7f0;
    --ink:        #17140f;
    --ink-2:      rgba(23,20,15,0.72);
    --ink-3:      rgba(23,20,15,0.48);
    --ink-4:      rgba(23,20,15,0.20);
    --rule:       rgba(23,20,15,0.12);
    --rule-2:     rgba(23,20,15,0.06);
    --accent:     oklch(0.52 0.17 28);      /* crimson */
    --accent-soft: oklch(0.93 0.04 28);
    --verified:   oklch(0.55 0.14 150);     /* forest */
    --verified-soft: oklch(0.94 0.04 150);
    --pending:    oklch(0.72 0.12 70);      /* amber */
    --pending-soft: oklch(0.96 0.04 70);
    --disputed:   oklch(0.55 0.17 28);
    --disputed-soft: oklch(0.95 0.04 28);

    --radius: 2px;
    --radius-lg: 4px;
    --shadow: 0 1px 0 rgba(23,20,15,0.04), 0 12px 32px -20px rgba(23,20,15,0.18);
  }

  html[data-theme="dark"] {
    --bg:         #0c0b0a;
    --bg-2:       #141211;
    --surface:    #171513;
    --surface-2:  #1e1b18;
    --ink:        #f3ece0;
    --ink-2:      rgba(243,236,224,0.72);
    --ink-3:      rgba(243,236,224,0.48);
    --ink-4:      rgba(243,236,224,0.18);
    --rule:       rgba(243,236,224,0.10);
    --rule-2:     rgba(243,236,224,0.05);
    --accent:     oklch(0.68 0.17 28);
    --accent-soft: oklch(0.28 0.09 28);
    --verified:   oklch(0.72 0.14 150);
    --verified-soft: oklch(0.26 0.07 150);
    --pending:    oklch(0.82 0.13 70);
    --pending-soft: oklch(0.28 0.08 70);
    --disputed:   oklch(0.68 0.17 28);
    --disputed-soft: oklch(0.28 0.09 28);
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 20px 40px -24px rgba(0,0,0,0.6);
  }

  html[data-theme="newsprint"] {
    --bg:         #e8e2d2;
    --bg-2:       #ddd6c2;
    --surface:    #f2ecdc;
    --surface-2:  #ebe4d0;
    --ink:        #1c1a14;
    --ink-2:      rgba(28,26,20,0.70);
    --ink-3:      rgba(28,26,20,0.48);
    --ink-4:      rgba(28,26,20,0.18);
    --rule:       rgba(28,26,20,0.16);
    --rule-2:     rgba(28,26,20,0.08);
    --accent:     oklch(0.40 0.14 28);
    --accent-soft: oklch(0.88 0.04 28);
    --verified:   oklch(0.42 0.10 150);
    --verified-soft: oklch(0.90 0.03 150);
    --pending:    oklch(0.58 0.10 70);
    --pending-soft: oklch(0.90 0.04 70);
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ff-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 280ms ease, color 280ms ease;
  }

  /* newsprint: faint paper grain */
  html[data-theme="newsprint"] body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1000;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
    opacity: 0.18;
  }

  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ─────────────────────────────────────────────────────
     APP SHELL
     ───────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 64px 1fr auto;
    grid-template-areas:
      "brand topbar"
      "nav   main"
      "nav   chain";
    min-height: 100vh;
    max-width: 1440px;
    margin: 0 auto;
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
    background: var(--bg);
  }

  .brand {
    grid-area: brand;
    display: flex; align-items: center; gap: 12px;
    padding: 0 28px;
    border-bottom: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }
  .brand .mk {
    width: 28px; height: 28px;
    border: 1.5px solid var(--ink);
    position: relative;
    display: grid; place-items: center;
  }
  .brand .mk::before, .brand .mk::after {
    content: ""; position: absolute;
    background: var(--ink);
  }
  .brand .mk::before { left: 4px; right: 4px; top: 50%; height: 1.5px; transform: translateY(-0.75px); }
  .brand .mk::after  { top: 4px; bottom: 4px; left: 50%; width: 1.5px; transform: translateX(-0.75px); }
  .brand .wordmark {
    font-family: var(--ff-display);
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand .wordmark em { font-style: italic; color: var(--accent); }

  .topbar {
    grid-area: topbar;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--rule);
    gap: 20px;
  }
  .topbar .crumbs {
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .crumbs .sep { color: var(--ink-4); }
  .topbar .crumbs .cur { color: var(--ink); }

  .topbar .right { display: flex; align-items: center; gap: 14px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    background: var(--surface);
    min-width: 260px;
    font-family: var(--ff-mono);
    font-size: 12px;
    color: var(--ink-3);
  }
  .search input {
    border: 0; background: transparent; outline: none; flex: 1;
    color: var(--ink); font-family: inherit; font-size: inherit;
  }
  .search .kbd {
    font-size: 10px; padding: 1px 6px;
    border: 1px solid var(--rule); color: var(--ink-3);
    background: var(--bg);
  }

  .btn {
    appearance: none;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost {
    background: transparent; color: var(--ink); border-color: var(--rule);
  }
  .btn.ghost:hover { background: var(--surface); border-color: var(--ink); color: var(--ink); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { filter: brightness(1.08); }
  .btn.sm { padding: 5px 10px; font-size: 10px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Left nav ── */
  .nav {
    grid-area: nav;
    border-right: 1px solid var(--rule);
    padding: 24px 16px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--bg);
  }
  .nav .section {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 18px 12px 6px;
  }
  .nav .section:first-child { margin-top: 0; }
  .nav button.item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    text-align: left;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 14px;
    font-family: inherit;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .nav button.item:hover { background: var(--surface); color: var(--ink); }
  .nav button.item.active {
    color: var(--ink);
    border-left-color: var(--accent);
    background: var(--surface);
    font-weight: 500;
  }
  .nav button.item .ico { width: 16px; height: 16px; display: grid; place-items: center; }
  .nav button.item .count {
    margin-left: auto;
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .nav .identity {
    margin-top: auto;
    border-top: 1px solid var(--rule);
    padding: 16px 12px 4px;
    display: flex; align-items: center; gap: 12px;
  }
  .nav .identity .avatar {
    width: 36px; height: 36px;
    border: 1px solid var(--ink);
    display: grid; place-items: center;
    font-family: var(--ff-display);
    font-size: 20px;
    background: var(--surface);
  }
  .nav .identity .meta { display: flex; flex-direction: column; min-width: 0; }
  .nav .identity .name {
    font-family: var(--ff-display);
    font-size: 18px;
    line-height: 1;
  }
  .nav .identity .handle {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── Main ── */
  .main {
    grid-area: main;
    padding: 36px 44px 80px;
    min-width: 0;
  }

  /* ── Chain drawer (hidden by default) ── */
  .chain-drawer {
    grid-area: chain;
    border-top: 1px solid var(--rule);
    background: var(--bg-2);
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--ink-3);
    padding: 10px 28px;
    display: none;
    align-items: center; gap: 24px;
    white-space: nowrap;
    overflow-x: auto;
  }
  html[data-advanced="true"] .chain-drawer { display: flex; }
  html[data-advanced="true"] .app { grid-template-rows: 64px 1fr auto; }
  .chain-drawer .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border: 1px solid var(--rule);
    background: var(--surface);
    letter-spacing: 0.1em;
  }
  .chain-drawer .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--verified);
    box-shadow: 0 0 6px var(--verified);
  }
  .chain-drawer .hash { color: var(--ink); }
  .chain-drawer .k { color: var(--ink-4); margin-right: 4px; }

  /* ─────────────────────────────────────────────────────
     TYPOGRAPHY
     ───────────────────────────────────────────────────── */
  .eyebrow {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  h1.page-title {
    font-family: var(--ff-display);
    font-size: 64px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin: 8px 0 4px;
  }
  h1.page-title em { font-style: italic; color: var(--accent); }
  .page-sub {
    color: var(--ink-2);
    font-size: 16px;
    max-width: 640px;
    line-height: 1.55;
  }
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 32px;
  }

  /* ─────────────────────────────────────────────────────
     LEDGER VIEW
     ───────────────────────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-bottom: 40px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .stat {
    padding: 22px 24px;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 6px;
    position: relative;
  }
  .stat:last-child { border-right: 0; }
  .stat .lbl {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .stat .val {
    font-family: var(--ff-display);
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat .val em { font-style: italic; color: var(--accent); }
  .stat .delta {
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--verified);
  }
  .stat .ring {
    position: absolute;
    right: 20px; top: 22px;
    width: 44px; height: 44px;
  }
  .stat .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .stat .ring .track { stroke: var(--rule); stroke-width: 4; fill: none; }
  .stat .ring .fill  { stroke: var(--verified); stroke-width: 4; fill: none; stroke-linecap: round; transition: stroke-dashoffset 600ms ease; }
  .stat .ring .pct {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--ink);
  }

  /* ── Filter bar ── */
  .filters {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .chip {
    appearance: none;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    background: transparent;
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 140ms ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .chip .n { color: var(--ink-4); font-size: 10px; }
  .chip[aria-pressed="true"] .n { color: rgba(255,255,255,0.6); }

  /* ── Ledger list ── */
  .ledger {
    display: grid;
    gap: 0;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .ledger .entry {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    gap: 28px;
    padding: 26px 28px;
    border-bottom: 1px solid var(--rule);
    align-items: flex-start;
    cursor: pointer;
    transition: background 140ms ease;
    position: relative;
  }
  .ledger .entry:last-child { border-bottom: 0; }
  .ledger .entry:hover { background: var(--surface-2); }
  .ledger .entry::before {
    content: ""; position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 140ms ease;
  }
  .ledger .entry:hover::before { opacity: 1; }

  .ledger .entry .when {
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding-top: 4px;
  }
  .ledger .entry .when .year {
    display: block;
    font-family: var(--ff-display);
    font-size: 28px;
    color: var(--ink);
    letter-spacing: -0.01em;
    text-transform: none;
  }
  .ledger .entry .body { min-width: 0; }
  .ledger .entry .cat {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .ledger .entry .cat .dot {
    width: 6px; height: 6px;
    background: var(--accent);
  }
  .ledger .entry h3 {
    font-family: var(--ff-display);
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .ledger .entry h3 em { font-style: italic; color: var(--accent); }
  .ledger .entry .desc {
    color: var(--ink-2);
    font-size: 14px;
    max-width: 640px;
    line-height: 1.5;
  }
  .ledger .entry .atts {
    margin-top: 12px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .ledger .entry .att-row {
    display: flex; align-items: center; gap: 4px;
  }
  .ledger .entry .att-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1.5px solid var(--surface);
    display: grid; place-items: center;
    font-family: var(--ff-mono);
    font-size: 9px;
    color: var(--ink-2);
    margin-left: -6px;
    position: relative;
  }
  .ledger .entry .att-avatar:first-child { margin-left: 0; }
  .ledger .entry .att-avatar.inst { background: var(--ink); color: var(--bg); border-color: var(--surface); }
  .ledger .entry .att-label {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-left: 6px;
  }

  .ledger .entry .meta-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    min-width: 150px;
  }

  /* trust badge */
  .trust {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 10px;
    border: 1px solid var(--verified);
    background: var(--verified-soft);
    color: var(--verified);
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .trust.pending { border-color: var(--pending); background: var(--pending-soft); color: var(--pending); }
  .trust.disputed { border-color: var(--disputed); background: var(--disputed-soft); color: var(--disputed); }
  .trust .score { font-family: var(--ff-mono); font-weight: 600; }
  .trust .check { width: 10px; height: 10px; }

  .id-stub {
    font-family: var(--ff-mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
  }
  .id-stub .prefix { color: var(--ink-4); }

  /* ─────────────────────────────────────────────────────
     DETAIL PANE (right-side sheet over ledger)
     ───────────────────────────────────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(23,20,15,0.32);
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
  }
  html[data-theme="dark"] .sheet-backdrop { background: rgba(0,0,0,0.6); }
  .sheet-backdrop.on { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 640px; max-width: 100vw;
    background: var(--surface);
    border-left: 1px solid var(--rule);
    z-index: 100;
    transform: translateX(100%);
    transition: transform 360ms cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
    box-shadow: -40px 0 80px -40px rgba(0,0,0,0.25);
  }
  .sheet.on { transform: translateX(0); }
  .sheet-head {
    padding: 24px 32px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .sheet-head .close {
    appearance: none;
    background: transparent; border: 1px solid var(--rule);
    width: 32px; height: 32px;
    cursor: pointer;
    display: grid; place-items: center;
    color: var(--ink-2);
  }
  .sheet-head .close:hover { color: var(--ink); border-color: var(--ink); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 32px; }
  .sheet-foot {
    padding: 18px 32px;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface-2);
  }

  .sheet h2 {
    font-family: var(--ff-display);
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .sheet h2 em { font-style: italic; color: var(--accent); }

  .sheet .section {
    border-top: 1px solid var(--rule-2);
    padding: 24px 0;
  }
  .sheet .section:first-of-type { border-top: 0; padding-top: 0; }
  .sheet .section h4 {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 14px;
    font-weight: 500;
  }

  .evidence-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    background: var(--surface-2);
    margin-bottom: 8px;
    transition: border-color 140ms ease;
  }
  .evidence-row:hover { border-color: var(--ink); }
  .evidence-row .doc-ico {
    width: 32px; height: 40px;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    display: grid; place-items: center;
    font-family: var(--ff-mono);
    font-size: 8px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    position: relative;
  }
  .evidence-row .doc-ico::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 8px; height: 8px;
    background: linear-gradient(-45deg, var(--bg) 50%, var(--rule) 50%);
  }
  .evidence-row .meta { flex: 1; min-width: 0; }
  .evidence-row .meta .name {
    font-size: 13px;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .evidence-row .meta .sub {
    font-family: var(--ff-mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }
  .evidence-row .hash {
    font-family: var(--ff-mono);
    font-size: 10px;
    color: var(--ink-3);
  }

  /* attestation pill with ring */
  .sheet .att-grid {
    display: grid; gap: 10px;
  }
  .att-card {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 16px;
    padding: 14px 16px;
    border: 1px solid var(--rule);
    background: var(--surface-2);
    align-items: center;
  }
  .att-card .av {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    font-family: var(--ff-display);
    font-size: 22px;
  }
  .att-card .av.inst { background: var(--ink); color: var(--bg); border-color: var(--ink); font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.1em; }
  .att-card .who { font-family: var(--ff-body); font-size: 14px; color: var(--ink); }
  .att-card .role { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .att-card .when-s { font-family: var(--ff-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; }

  .trust-big {
    display: flex; align-items: center; gap: 20px;
    padding: 18px 22px;
    background: var(--verified-soft);
    border: 1px solid var(--verified);
    color: var(--verified);
    margin-bottom: 10px;
  }
  .trust-big.pending { background: var(--pending-soft); border-color: var(--pending); color: var(--pending); }
  .trust-big.disputed { background: var(--disputed-soft); border-color: var(--disputed); color: var(--disputed); }
  .trust-big .ring-lg {
    width: 54px; height: 54px; position: relative;
    flex-shrink: 0;
  }
  .trust-big .ring-lg svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .trust-big .ring-lg .track { stroke: currentColor; stroke-width: 4; fill: none; opacity: 0.2; }
  .trust-big .ring-lg .fill  { stroke: currentColor; stroke-width: 4; fill: none; stroke-linecap: round; transition: stroke-dashoffset 600ms ease; }
  .trust-big .ring-lg .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--ff-mono); font-size: 13px; color: currentColor; font-weight: 500; }
  .trust-big .info .lab { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.8; }
  .trust-big .info .title {
    font-family: var(--ff-display);
    font-size: 22px;
    color: currentColor;
    margin-top: 2px;
    letter-spacing: -0.01em;
  }

  .chain-list {
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--ink-2);
  }
  .chain-list .row {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .chain-list .row:last-child { border: 0; }
  .chain-list .row .k { color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; }
  .chain-list .row .v { color: var(--ink); word-break: break-all; }

  /* ─────────────────────────────────────────────────────
     NEW PROOF WIZARD
     ───────────────────────────────────────────────────── */
  .wizard { max-width: 820px; }
  .wizard .stepper {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-bottom: 40px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .wizard .step {
    padding: 16px 18px;
    border-right: 1px solid var(--rule);
    position: relative;
    cursor: pointer;
  }
  .wizard .step:last-child { border-right: 0; }
  .wizard .step .n {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-3);
  }
  .wizard .step .t {
    font-family: var(--ff-display);
    font-size: 20px;
    line-height: 1.1;
    margin-top: 4px;
    color: var(--ink-2);
  }
  .wizard .step.active {
    background: var(--ink); color: var(--bg);
  }
  .wizard .step.active .n { color: rgba(255,255,255,0.6); }
  .wizard .step.active .t { color: var(--bg); }
  .wizard .step.done .t { color: var(--ink); }
  .wizard .step.done::after {
    content: "✓";
    position: absolute; top: 12px; right: 14px;
    font-size: 14px;
    color: var(--verified);
  }

  .wizard .panel {
    padding: 40px 0;
  }
  .wizard .panel h2 {
    font-family: var(--ff-display);
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .wizard .panel h2 em { font-style: italic; color: var(--accent); }
  .wizard .panel .lede { color: var(--ink-2); font-size: 16px; max-width: 560px; margin-bottom: 32px; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .type-card {
    appearance: none;
    padding: 20px;
    border: 1px solid var(--rule);
    background: var(--surface);
    text-align: left;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    position: relative;
    transition: border-color 140ms ease, background 140ms ease;
    font-family: inherit;
    color: inherit;
  }
  .type-card:hover { border-color: var(--ink); }
  .type-card[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .type-card[aria-pressed="true"]::after {
    content: "";
    position: absolute; top: 14px; right: 14px;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
  }
  .type-card .ico {
    width: 22px; height: 22px;
    border: 1.5px solid var(--ink);
    display: grid; place-items: center;
    font-family: var(--ff-display);
    font-size: 16px;
    margin-bottom: 6px;
  }
  .type-card .name {
    font-family: var(--ff-display);
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .type-card .desc {
    font-size: 12px; color: var(--ink-3);
    line-height: 1.4;
  }

  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .field label {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .field .hint { font-family: var(--ff-mono); font-size: 10px; color: var(--ink-3); }
  .field input[type="text"],
  .field input[type="date"],
  .field textarea,
  .field select {
    font-family: var(--ff-body);
    font-size: 15px;
    padding: 11px 14px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 140ms ease;
    width: 100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { min-height: 110px; resize: vertical; font-family: var(--ff-body); line-height: 1.5; }

  .dropzone {
    border: 1.5px dashed var(--rule);
    padding: 28px 20px;
    text-align: center;
    background: var(--surface);
    cursor: pointer;
    transition: border-color 140ms ease, background 140ms ease;
  }
  .dropzone:hover { border-color: var(--ink); background: var(--surface-2); }
  .dropzone.active { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .big {
    font-family: var(--ff-display);
    font-size: 28px;
    letter-spacing: -0.01em;
  }
  .dropzone .sub { font-family: var(--ff-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }

  .added-evidence { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

  .attest-list .att-row-w {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--rule);
    background: var(--surface);
    margin-bottom: 8px;
    align-items: center;
  }
  .attest-list .av {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    font-family: var(--ff-display);
    font-size: 22px;
  }
  .attest-list .av.inst { background: var(--ink); color: var(--bg); border-color: var(--ink); font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.1em; }
  .attest-list .who { font-size: 14px; }
  .attest-list .role { font-family: var(--ff-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }
  .attest-list .rm { appearance: none; background: transparent; border: 1px solid var(--rule); padding: 4px 10px; font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
  .attest-list .rm:hover { border-color: var(--accent); color: var(--accent); }

  .add-attestor {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    padding: 14px 16px;
    border: 1px dashed var(--rule);
    background: var(--surface-2);
  }
  .add-attestor input { padding: 8px 10px; }
  .add-attestor button { padding: 8px 14px; font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--ink); color: var(--bg); border: 1px solid var(--ink); cursor: pointer; }
  .add-attestor button:disabled { opacity: 0.4; cursor: not-allowed; }

  .wizard .nav-row {
    margin-top: 36px;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
  }

  /* review step */
  .review-card {
    border: 1px solid var(--rule);
    background: var(--surface);
    padding: 28px 32px;
  }
  .review-card .line {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule-2);
    align-items: baseline;
  }
  .review-card .line:last-child { border: 0; }
  .review-card .line .k { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
  .review-card .line .v { color: var(--ink); }
  .review-card h3 {
    font-family: var(--ff-display);
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .review-card h3 em { font-style: italic; color: var(--accent); }

  /* ─────────────────────────────────────────────────────
     MINT / SUCCESS
     ───────────────────────────────────────────────────── */
  .mint {
    text-align: center;
    padding: 60px 20px;
  }
  .mint .seal {
    position: relative;
    width: 180px; height: 180px;
    margin: 0 auto 28px;
  }
  .mint .seal svg { width: 100%; height: 100%; }
  .mint .seal .outer {
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 565;
    stroke-dashoffset: 565;
    animation: draw 1.2s ease forwards;
  }
  .mint .seal .inner {
    stroke: var(--accent); stroke-width: 1; fill: none;
    stroke-dasharray: 440; stroke-dashoffset: 440;
    animation: draw 1.2s ease 0.2s forwards;
  }
  .mint .seal .tick {
    stroke: var(--accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: draw 0.6s ease 1s forwards;
  }
  .mint .seal .stamp-text {
    font-family: var(--ff-mono);
    font-size: 7px;
    letter-spacing: 0.24em;
    fill: var(--accent);
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .mint h2 {
    font-family: var(--ff-display);
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .mint h2 em { font-style: italic; color: var(--accent); }
  .mint .lede { color: var(--ink-2); font-size: 17px; max-width: 520px; margin: 0 auto 28px; }

  .mint .proof-id {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border: 1px solid var(--rule);
    background: var(--surface);
    font-family: var(--ff-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
  }
  .mint .proof-id .k { color: var(--ink-3); }
  .mint .cta-row { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

  .minting {
    text-align: center;
    padding: 80px 20px;
  }
  .minting .spinner {
    width: 56px; height: 56px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 28px;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .minting h2 {
    font-family: var(--ff-display);
    font-size: 44px;
    line-height: 1.05;
    margin: 0 0 10px;
  }
  .minting .steps {
    margin-top: 36px;
    display: flex; flex-direction: column; gap: 6px;
    max-width: 420px; margin-left: auto; margin-right: auto;
    font-family: var(--ff-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    text-align: left;
  }
  .minting .steps .s {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
    opacity: 0.4;
    transition: opacity 240ms ease, color 240ms ease;
  }
  .minting .steps .s .mark { width: 14px; font-family: var(--ff-mono); }
  .minting .steps .s.on { opacity: 1; color: var(--ink); }
  .minting .steps .s.on .mark { color: var(--verified); }

  /* ─────────────────────────────────────────────────────
     PUBLIC PROOF / VERIFIER VIEW
     ───────────────────────────────────────────────────── */
  .verifier {
    max-width: 920px;
    margin: 0 auto;
  }
  .verifier .paper {
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 60px 72px;
    position: relative;
  }
  html[data-theme="newsprint"] .verifier .paper { background: #f2ecdc; }
  .verifier .stamp {
    position: absolute;
    top: 32px; right: 40px;
    width: 128px; height: 128px;
    border: 2px solid var(--verified);
    color: var(--verified);
    display: grid; place-items: center;
    border-radius: 50%;
    transform: rotate(-8deg);
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    padding: 10px;
    opacity: 0.85;
  }
  .verifier .stamp::before {
    content: "";
    position: absolute; inset: 6px;
    border: 1px solid var(--verified);
    border-radius: 50%;
  }
  .verifier .stamp .big {
    font-family: var(--ff-display);
    font-size: 22px;
    letter-spacing: 0;
  }
  .verifier .pre {
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .verifier .pre .ln { flex: 1; height: 1px; background: var(--rule); }
  .verifier h1 {
    font-family: var(--ff-display);
    font-size: 72px;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin: 0 0 14px;
  }
  .verifier h1 em { font-style: italic; color: var(--accent); }
  .verifier .dateline {
    font-family: var(--ff-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 28px;
  }
  .verifier .statement {
    font-family: var(--ff-display);
    font-size: 24px;
    line-height: 1.45;
    color: var(--ink-2);
    max-width: 700px;
    padding: 20px 0 28px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 28px;
  }
  .verifier .grid-two {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 48px;
  }
  .verifier .grid-two h3 {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 14px;
    font-weight: 500;
  }

  .verifier .owner {
    padding: 20px 24px;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    display: flex; align-items: center; gap: 16px;
    margin-top: 40px;
  }
  .verifier .owner .av {
    width: 54px; height: 54px;
    border: 1px solid var(--ink);
    display: grid; place-items: center;
    background: var(--surface);
    font-family: var(--ff-display);
    font-size: 28px;
  }
  .verifier .owner .name {
    font-family: var(--ff-display);
    font-size: 28px;
    line-height: 1.1;
  }
  .verifier .owner .handle {
    font-family: var(--ff-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }
  .verifier .owner .count {
    margin-left: auto;
    text-align: right;
  }
  .verifier .owner .count .n {
    font-family: var(--ff-display);
    font-size: 32px;
    line-height: 1;
  }
  .verifier .owner .count .l {
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .verifier .foot {
    margin-top: 32px;
    font-family: var(--ff-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }

  /* ─────────────────────────────────────────────────────
     PROFILE VIEW
     ───────────────────────────────────────────────────── */
  .profile-hero {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 40px;
    align-items: center;
    padding: 40px;
    background: var(--surface);
    border: 1px solid var(--rule);
    margin-bottom: 40px;
  }
  .profile-hero .avatar-big {
    width: 120px; height: 120px;
    border: 1.5px solid var(--ink);
    display: grid; place-items: center;
    font-family: var(--ff-display);
    font-size: 64px;
    background: var(--bg-2);
  }
  .profile-hero h2 {
    font-family: var(--ff-display);
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .profile-hero .handle {
    font-family: var(--ff-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-3);
    margin-top: 6px;
  }
  .profile-hero .bio {
    color: var(--ink-2);
    font-size: 15px;
    max-width: 520px;
    margin-top: 12px;
    line-height: 1.5;
  }
  .profile-hero .score-col {
    text-align: right;
  }
  .profile-hero .score-col .big-ring {
    width: 110px; height: 110px; position: relative; margin-left: auto;
  }
  .profile-hero .score-col .big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .profile-hero .score-col .big-ring .track { stroke: var(--rule); stroke-width: 5; fill: none; }
  .profile-hero .score-col .big-ring .fill  { stroke: var(--verified); stroke-width: 5; fill: none; stroke-linecap: round; }
  .profile-hero .score-col .big-ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--ff-display); font-size: 34px; color: var(--verified); }
  .profile-hero .score-col .lab { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }

function NewProofWizard({ onDone, onCancel, strict }) {
  const [step, setStep] = uS(0);

    if (step === 0) return !!data.type;
    if (step === 1) return data.title.trim().length > 2 && data.date && data.statement.trim().length > 10;

      if (strict === 'strict') return data.evidence.length >= 1 && data.attestations.length >= 1;

  };

  const addEvidence = () => {
    const samples = [
    { name: 'certificate.pdf', size: '182 KB', hash: '0x' + Math.random().toString(16).slice(2, 7) + '…' },
    { name: 'receipt-of-service.pdf', size: '94 KB', hash: '0x' + Math.random().toString(16).slice(2, 7) + '…' },
    { name: 'photograph.jpg', size: '2.1 MB', hash: '0x' + Math.random().toString(16).slice(2, 7) + '…' },
    { name: 'signed-letter.pdf', size: '148 KB', hash: '0x' + Math.random().toString(16).slice(2, 7) + '…' }];

    const pick = samples[data.evidence.length % samples.length];
    setData((d) => ({ ...d, evidence: [...d.evidence, pick] }));
  };

  const addAtt = () => {
    if (!attInput.name.trim() || !attInput.role.trim()) return;
    const a = {
      kind: attInput.kind,
      name: attInput.name,
      role: attInput.role,
      initials: attInput.name.split(' ').map((s) => s[0]).slice(0, 2).join('').toUpperCase(),
      when: new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' })
    };
    setData((d) => ({ ...d, attestations: [...d.attestations, a] }));
    setAttInput({ name: '', role: '', kind: 'peer' });
  };

  const doMint = () => {
    setMinting(true);
    setTimeout(() => {
      setMinting(false);
      const id = 'LP-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random() * 10000)).padStart(4, '0') + '-' + Math.random().toString(16).slice(2, 6).toUpperCase();

      const trust = Math.min(98, 60 + data.attestations.filter((a) => a.kind === 'institution').length * 10 + data.attestations.filter((a) => a.kind === 'peer').length * 6);
      setMinted({
        id, hash, trust,
        block: 20_500_000 + Math.floor(Math.random() * 100_000),
        title: data.title,
        statement: data.statement,
        category: data.type,
        issuedAt: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
        dateline: data.date,
        status: 'verified',
        evidence: data.evidence,
        attestations: data.attestations
      });
    }, 2800);
  };

          </div>
        </div>
        <div className="cta-row">
          <button className="btn accent" onClick={() => onDone(minted, 'public')}>
            <Icon name="share" size={12} /> View public proof
          </button>
          <button className="btn ghost" onClick={() => onDone(minted, 'ledger')}>Back to ledger</button>
        </div>
      </div>);

  }

  if (minting) {
    return (
      <div className="minting">
        <div className="spinner" />
        <h2>Minting your Proof…</h2>
        <p style={{ color: 'var(--ink-2)', maxWidth: 420, margin: '0 auto' }}>Hashing evidence, collecting signatures, writing to the ledger.</p>
        <div className="steps">
          <MintStep label="Hashing evidence files" delay={200} />
          <MintStep label="Generating proof ID" delay={800} />
          <MintStep label="Collecting attestor signatures" delay={1400} />
          <MintStep label="Writing to permanent ledger" delay={2100} />

        </div>

            {TYPE_OPTIONS.map((o) =>
          <button key={o.id} className="type-card" aria-pressed={data.type === o.id}
          onClick={() => setData((d) => ({ ...d, type: o.id }))}>
                <div className="ico">{o.ico}</div>
                <div className="name">{o.name}</div>
                <div className="desc">{o.desc}</div>
              </button>
          )}
          </div>
        </div>
      }

      {step === 1 &&
      <div className="panel">
          <h2>State the <em>claim</em>.</h2>
          <p className="lede">Concise title. The date it happened. A plain-language statement — how you'd explain it to a stranger.</p>
          <div className="field">
            <label>Title</label>
            <input type="text" placeholder="e.g. 10 Years Sober"
          value={data.title} onChange={(e) => setData((d) => ({ ...d, title: e.target.value }))} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div className="field">
              <label>Date of record</label>
              <input type="date" value={data.date} onChange={(e) => setData((d) => ({ ...d, date: e.target.value }))} />
            </div>
            <div className="field">
              <label>Category</label>
              <input type="text" disabled value={data.type || '—'} />
            </div>
          </div>
          <div className="field">
            <label>Statement</label>
            <textarea placeholder="Say it plainly. Who, what, when, and the truth of it."
          value={data.statement} onChange={(e) => setData((d) => ({ ...d, statement: e.target.value }))} />
            <div className="hint">{data.statement.length} chars · aim for 140–400</div>
          </div>
        </div>
      }

      {step === 2 &&
      <div className="panel">
          <h2>Show the <em>receipts</em>.</h2>
          <p className="lede">Attach evidence. Invite people who can vouch. {strict === 'strict' ? 'At least one of each is required.' : 'Nothing is required — but every signer strengthens your score.'}</p>

          <div className="field">
            <label>Evidence · {data.evidence.length} attached</label>
            <div className="dropzone" onClick={addEvidence}>
              <div className="big">Drop files or click to upload</div>
              <div className="sub">PDF · PNG · JPG · TXT — hashed locally, then stored encrypted</div>
            </div>
            <div className="added-evidence">
              {data.evidence.map((e, i) => <EvidenceRow key={i} ev={e} />)}
            </div>
          </div>

          <div className="field">
            <label>Attestors · {data.attestations.length} invited</label>
            <div className="attest-list">
              {data.attestations.map((a, i) =>
            <div key={i} className="att-row-w">
                  <div className={`av ${a.kind === 'institution' ? 'inst' : ''}`}>
                    {a.kind === 'institution' ? a.name.slice(0, 3).toUpperCase() : a.initials}
                  </div>
                  <div>
                    <div className="who">{a.name}</div>
                    <div className="role">{a.role}</div>
                  </div>
                  <button className="rm" onClick={() => setData((d) => ({ ...d, attestations: d.attestations.filter((_, j) => j !== i) }))}>Remove</button>
                </div>
            )}
              <div className="add-attestor">
                <input type="text" placeholder="Name or institution" value={attInput.name}
              onChange={(e) => setAttInput((a) => ({ ...a, name: e.target.value }))} />
                <input type="text" placeholder="Role (sponsor, employer, issuer…)" value={attInput.role}
              onChange={(e) => setAttInput((a) => ({ ...a, role: e.target.value }))} />
                <button onClick={addAtt} disabled={!attInput.name.trim() || !attInput.role.trim()}>Add</button>
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                <button className="chip" aria-pressed={attInput.kind === 'peer'} onClick={() => setAttInput((a) => ({ ...a, kind: 'peer' }))}>Peer / human</button>
                <button className="chip" aria-pressed={attInput.kind === 'institution'} onClick={() => setAttInput((a) => ({ ...a, kind: 'institution' }))}>Institution</button>
              </div>
            </div>
          </div>
        </div>
      }

      {step === 3 &&
      <div className="panel">
          <h2>Review &amp; <em>mint</em>.</h2>
          <p className="lede">Once you mint, this proof is permanent. You can update later — but every version stays on the record.</p>
          <div className="review-card">
            <div style={{ marginBottom: 20 }}>
              <div className="eyebrow" style={{ marginBottom: 4 }}>{data.type}</div>
              <h3>{data.title}</h3>
              <div className="id-stub" style={{ marginTop: 2 }}>{data.date}</div>
            </div>
            <div className="line">
              <div className="k">Statement</div>
              <div className="v" style={{ fontFamily: 'var(--ff-display)', fontSize: 18, lineHeight: 1.45 }}>{data.statement}</div>
            </div>
            <div className="line">
              <div className="k">Evidence</div>
              <div className="v">{data.evidence.length} file{data.evidence.length === 1 ? '' : 's'} hashed</div>
            </div>
            <div className="line">
              <div className="k">Attestors</div>
              <div className="v">{data.attestations.length} invited — {data.attestations.filter((a) => a.kind === 'institution').length} institutions, {data.attestations.filter((a) => a.kind === 'peer').length} peers</div>
            </div>
            <div className="line">
              <div className="k">Projected trust</div>
              <div className="v"><TrustBadge score={Math.min(98, 60 + data.attestations.filter((a) => a.kind === 'institution').length * 10 + data.attestations.filter((a) => a.kind === 'peer').length * 6)} /></div>
            </div>
          </div>
        </div>
      }

      <div className="nav-row">
        {step > 0 ?
        <button className="btn ghost" onClick={() => setStep((s) => s - 1)}>
            <Icon name="arrow-left" size={12} /> Back
          </button> :
        <span />}
        {step < 3 ?
        <button className="btn" disabled={!canNext()} onClick={() => setStep((s) => s + 1)}>
            Continue <Icon name="arrow-right" size={12} />
          </button> :

        <button className="btn accent" onClick={doMint}>
            <Icon name="shield" size={12} /> Mint Proof
          </button>
        }
      </div>
    </div>);

}
window.NewProofWizard = NewProofWizard;

function MintStep({ label, delay }) {
  const [on, setOn] = uS(false);
  uE(() => {
    const t = setTimeout(() => setOn(true), delay);
    return () => clearTimeout(t);
  }, [delay]);
  return (
    <div className={`s ${on ? 'on' : ''}`}>
      <span className="mark">{on ? '✓' : '·'}</span> {label}
    </div>);

}

/* Root app — routing and chain drawer */

const { useState: usS, useEffect: usE } = React;

function App() {
  const tweaks = window.useTweaks();
  const persona = window.PERSONAS[tweaks.persona] || window.PERSONAS.del;

  const [view, setView] = usS('ledger'); // ledger | new | public | profile
  const [openProof, setOpenProof] = usS(null);
  const [publicProof, setPublicProof] = usS(null);

  // When persona changes, reset open state
  usE(() => {setOpenProof(null);}, [tweaks.persona]);

  const handleOpenPublic = (proof) => {
    setOpenProof(null);
    setPublicProof(proof);
    setView('public');
  };

  const handleNewDone = (minted, to) => {
    if (to === 'public') {
      setPublicProof(minted);
      setView('public');
    } else {
      setView('ledger');
    }
  };

  const crumbs = {
    ledger: 'Ledger',
    new: 'New Proof',
    public: 'Public View',
    profile: 'Profile'
  };

  return (
    <>
      <div className="app">
        <div className="brand">
          <div className="mk" />
          <div className="wordmark">Living <em>Proof</em></div>
        </div>

        <div className="topbar">
          <div className="crumbs">
            <span>Home</span>
            <span className="sep">›</span>
            <span className="cur">{crumbs[view]}</span>
          </div>
          <div className="right">
            <div className="search">
              <Icon name="search" size={13} />
              <input placeholder="Search proofs, attestors, IDs…" />
              <span className="kbd">⌘K</span>
            </div>
            <button className="btn ghost sm"><Icon name="verify" size={12} /> Verify a Proof</button>
          </div>
        </div>

        <div className="nav">
          <div className="section">Record</div>
          <button className={`item ${view === 'ledger' ? 'active' : ''}`} onClick={() => setView('ledger')}>
            <span className="ico"><Icon name="ledger" size={15} /></span>

            <span className="count">{tweaks.populated ? persona.proofs.length : 0}</span>
          </button>
          <button className={`item ${view === 'new' ? 'active' : ''}`} onClick={() => setView('new')}>
            <span className="ico"><Icon name="plus" size={15} stroke={2} /></span>
            New Proof
          </button>

          <div className="section">Public</div>
          <button className={`item ${view === 'profile' ? 'active' : ''}`} onClick={() => setView('profile')}>
            <span className="ico"><Icon name="profile" size={15} /></span>
            My Profile
          </button>
          <button className="item" onClick={() => {
            if (tweaks.populated && persona.proofs.length) handleOpenPublic(persona.proofs[0]);
          }}>
            <span className="ico"><Icon name="verify" size={15} /></span>
            Verifier
          </button>

          <div className="section">Account</div>
          <button className="item">
            <span className="ico"><Icon name="settings" size={15} /></span>
            Settings
          </button>

          <div className="identity">
            <div className="avatar">{persona.initials}</div>
            <div className="meta">
              <div className="name">{persona.name.split(' ')[0]}</div>

            </div>
          </div>
        </div>

        <div className="main">
          {view === 'ledger' &&
          <LedgerView
            persona={persona}
            populated={tweaks.populated}
            onOpen={setOpenProof}
            onNew={() => setView('new')}
            onOpenPublic={handleOpenPublic} />

          }
          {view === 'new' &&
          <NewProofWizard
            strict={tweaks.strict}
            onDone={handleNewDone}
            onCancel={() => setView('ledger')} />

          }
          {view === 'public' &&
          <PublicProofView
            proof={publicProof}
            persona={persona}
            advanced={tweaks.advanced}
            onBack={() => setView('ledger')} />

          }
          {view === 'profile' &&
          <ProfileView

            populated={tweaks.populated}
            onOpenPublic={handleOpenPublic} />

          }
        </div>

        <div className="chain-drawer">
          <span className="pill"><span className="dot" /> Protocol · ONLINE</span>
          <span><span className="k">net</span> <span className="hash">lpp-mainnet</span></span>
          <span><span className="k">block</span> <span className="hash">#20,841,207</span></span>
          <span><span className="k">gas</span> <span className="hash">12.4 gwei</span></span>
          <span><span className="k">sig</span> <span className="hash">secp256k1 · eip-712</span></span>
          <span><span className="k">ipfs</span> <span className="hash">bafybei…k7q2</span></span>
          <span style={{ marginLeft: 'auto' }} className="pill">dev mode</span>
        </div>
      </div>

      <DetailSheet
        proof={openProof}
        advanced={tweaks.advanced}
        onClose={() => setOpenProof(null)}
        onOpenPublic={handleOpenPublic} />
      
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Tweaks wiring
  (function () {
    const root = document.documentElement;
    const panel = document.getElementById('tweaks');

    function applyAll(t) {
      root.setAttribute('data-theme', t.theme);
      root.setAttribute('data-persona', t.persona);
      root.setAttribute('data-empty', (!t.populated).toString());
      root.setAttribute('data-advanced', t.advanced.toString());
      root.setAttribute('data-strict', t.strict);
      // broadcast so React can re-read attrs
      window.dispatchEvent(new CustomEvent('lpp-tweak', { detail: t }));
    }

    const current = { ...TWEAK_DEFAULTS };
    applyAll(current);

    function refreshChips() {
      panel.querySelectorAll('.chips').forEach(group => {
        const key = group.dataset.key;
        group.querySelectorAll('.chip-t').forEach(btn => {
          const v = btn.dataset.val;
          const cur = String(current[key]);
          btn.setAttribute('aria-pressed', v === cur ? 'true' : 'false');
        });
      });
    }
    refreshChips();

    panel.addEventListener('click', e => {
      const btn = e.target.closest('.chip-t');
      if (!btn) return;
      const key = btn.parentElement.dataset.key;
      let val = btn.dataset.val;
      if (val === 'true') val = true;
      else if (val === 'false') val = false;
      current[key === 'populated' ? 'populated' : key] = val;
      applyAll(current);
      refreshChips();
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: current }, '*');
    });

    // Host integration
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') panel.classList.add('on');
      if (e.data.type === '__deactivate_edit_mode') panel.classList.remove('on');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  })();
</script>
